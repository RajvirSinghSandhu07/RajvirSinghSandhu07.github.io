<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent-ai" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid-ai" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grad-ai)"/>
  <rect width="800" height="450" fill="url(#grid-ai)"/>
  <circle cx="400" cy="225" r="150" fill="#06b6d4" opacity="0.08" filter="blur(70px)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="350" rx="12" fill="#09090b" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="680" height="38" rx="12" fill="#0f172a"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="19" r="5" fill="#10b981" opacity="0.8"/>
    <text x="340" y="24" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">ai-lab // exploratory-prototypes</text>

    <!-- Center Icon & Text -->
    <g transform="translate(340, 140)">
      <circle cx="0" cy="0" r="38" fill="#0c1e33" stroke="#0ea5e9" stroke-width="2"/>
      <path d="M -14 -10 L 14 -10 L 0 16 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="-14" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="14" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="0" cy="16" r="3" fill="#38bdf8"/>
    </g>

    <text x="340" y="215" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">AI &amp; Algorithm Research Lab</text>
    <text x="340" y="245" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Interactive sandbox for upcoming AI-assisted tools and machine learning prototypes</text>
    <text x="340" y="275" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">[ Slot reserved for your future manual additions ]</text>
  </g>
</svg>
