<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sih" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="accent-sih" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid-sih" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grad-sih)"/>
  <rect width="800" height="450" fill="url(#grid-sih)"/>
  <circle cx="650" cy="100" r="140" fill="#6366f1" opacity="0.12" filter="blur(60px)"/>
  
  <!-- Sleek Frame / Code Canvas -->
  <g transform="translate(60, 50)">
    <rect width="680" height="350" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect width="680" height="38" rx="12" fill="#18181b"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="19" r="5" fill="#10b981" opacity="0.8"/>
    <text x="340" y="24" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">sih-prototype // college-screening</text>
    
    <!-- Content Representation -->
    <rect x="36" y="65" width="220" height="22" rx="4" fill="url(#accent-sih)" opacity="0.9"/>
    <text x="46" y="80" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SMART INDIA HACKATHON</text>

    <!-- UI Wireframe Lines -->
    <rect x="36" y="105" width="380" height="12" rx="3" fill="#27272a"/>
    <rect x="36" y="128" width="320" height="10" rx="3" fill="#1f1f23"/>
    <rect x="36" y="148" width="340" height="10" rx="3" fill="#1f1f23"/>
    
    <!-- Metrics card in preview -->
    <rect x="36" y="180" width="180" height="120" rx="8" fill="#121318" stroke="#27272a"/>
    <text x="52" y="210" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">SCREENING STATUS</text>
    <text x="52" y="240" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">CLEARED</text>
    <text x="52" y="270" fill="#a1a1aa" font-family="monospace" font-size="10">College Round Selection</text>

    <rect x="236" y="180" width="180" height="120" rx="8" fill="#121318" stroke="#27272a"/>
    <text x="252" y="210" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ARCHITECTURE</text>
    <text x="252" y="240" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Problem Solver</text>
    <text x="252" y="270" fill="#a1a1aa" font-family="monospace" font-size="10">Team Prototype v1.0</text>

    <!-- Side code preview -->
    <rect x="440" y="65" width="204" height="235" rx="8" fill="#0d0e12" stroke="#27272a"/>
    <path d="M 460 90 L 580 90 M 460 110 L 610 110 M 480 130 L 560 130 M 480 150 L 590 150 M 480 170 L 540 170 M 460 190 L 520 190 M 460 220 L 600 220 M 480 240 L 570 240 M 460 260 L 500 260" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
