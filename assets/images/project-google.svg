<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-google" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="g-colors" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid-g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grad-google)"/>
  <rect width="800" height="450" fill="url(#grid-g)"/>
  <circle cx="200" cy="120" r="160" fill="#38bdf8" opacity="0.1" filter="blur(70px)"/>

  <g transform="translate(60, 50)">
    <rect width="680" height="350" rx="12" fill="#09090b" stroke="#27272a" stroke-width="1.5"/>
    <rect width="680" height="38" rx="12" fill="#18181b"/>
    <circle cx="24" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="42" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="60" cy="19" r="5" fill="#10b981" opacity="0.8"/>
    <text x="340" y="24" fill="#71717a" font-family="monospace" font-size="12" text-anchor="middle">google-hackathon // prototype-r2</text>

    <!-- Tag -->
    <rect x="36" y="65" width="210" height="22" rx="4" fill="url(#g-colors)" opacity="0.95"/>
    <text x="46" y="80" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">GOOGLE HACKATHON</text>

    <!-- Content layout -->
    <rect x="36" y="105" width="400" height="12" rx="3" fill="#27272a"/>
    <rect x="36" y="128" width="350" height="10" rx="3" fill="#1f1f23"/>
    <rect x="36" y="148" width="370" height="10" rx="3" fill="#1f1f23"/>

    <!-- Key Milestone Badge Card -->
    <rect x="36" y="180" width="380" height="120" rx="8" fill="#13151f" stroke="#312e81" stroke-width="1.5"/>
    <text x="56" y="215" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">SELECTION MILESTONE</text>
    <text x="56" y="248" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">Advanced to Round 2</text>
    <text x="56" y="278" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="12">Collaborative Team Prototype &amp; Solution Architecture</text>

    <!-- Tech visualization / nodes on right -->
    <rect x="440" y="65" width="204" height="235" rx="8" fill="#0d0e14" stroke="#27272a"/>
    <circle cx="542" cy="120" r="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
    <text x="542" y="125" fill="#e0e7ff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">CORE</text>

    <line x1="542" y1="148" x2="490" y2="200" stroke="#4338ca" stroke-width="2" stroke-dasharray="2 2"/>
    <line x1="542" y1="148" x2="594" y2="200" stroke="#4338ca" stroke-width="2" stroke-dasharray="2 2"/>

    <circle cx="490" cy="215" r="20" fill="#0c1d2e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="490" y="219" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">API</text>

    <circle cx="594" cy="215" r="20" fill="#1e1035" stroke="#a855f7" stroke-width="1.5"/>
    <text x="594" y="219" fill="#f3e8ff" font-family="monospace" font-size="10" text-anchor="middle">UI</text>

    <text x="542" y="275" fill="#71717a" font-family="monospace" font-size="10" text-anchor="middle">Interactive Prototype Stack</text>
  </g>
</svg>
